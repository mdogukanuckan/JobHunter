# JobHunter - n8n (yerel gelistirme)
#
# Calistirma (bu klasorde):   docker compose up -d
# Arayuz:                     http://localhost:5678
# Loglar:                     docker compose logs -f n8n
# Durdurma:                   docker compose down      (veriler volume'de kalir)
#
# Ilk kurulum adimlari icin: automation/n8n/README.md

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jobhunter-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      # Credential'lar veritabaninda bu anahtarla sifrelenir. Kaybolursa credential'lar okunamaz;
      # n8n'i baska sunucuya (orn. Oracle) tasirken ayni anahtar kullanilmali.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?.env dosyasinda N8N_ENCRYPTION_KEY tanimlanmali}
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Calisma kayitlari (execution) kisisel veri icerir (profil paketi): 14 gunden eskiler silinir.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    extra_hosts:
      # Container icinden bilgisayardaki backend'e (localhost:5080) "host.docker.internal:5080" ile ulasilir.
      # Docker Desktop'ta zaten tanimli; Linux'ta bu satir gerekir.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n        # workflow'lar, credential'lar, calisma kayitlari (SQLite)
      - ./setup:/setup:ro               # import betigi + workflow JSON'lari

volumes:
  n8n_data:
    name: jobhunter_n8n_data
