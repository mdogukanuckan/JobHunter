# JobHunter - n8n (yerel gelistirme)
#
# Calistirma (bu klasorde):   docker compose up -d
# Arayuz:                     http://localhost:5678
# Loglar:                     docker compose logs -f n8n
# Durdurma:                   docker compose down      (veriler volume'de kalir)
#
# Ilk kurulum adimlari icin: automation/n8n/README.md
# Servisler: n8n (5678) + browser-worker (Faz 10, 127.0.0.1:3100)

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jobhunter-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      # Credential'lar veritabaninda bu anahtarla sifrelenir. Kaybolursa credential'lar okunamaz;
      # n8n'i baska sunucuya (orn. Oracle) tasirken ayni anahtar kullanilmali.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?.env dosyasinda N8N_ENCRYPTION_KEY tanimlanmali}
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Faz 13: WhatsApp bildirimi icin expression'larda $env erisimine izin ver
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Calisma kayitlari (execution) kisisel veri icerir (profil paketi): 14 gunden eskiler silinir.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    extra_hosts:
      # Container icinden bilgisayardaki backend'e (localhost:5080) "host.docker.internal:5080" ile ulasilir.
      # Docker Desktop'ta zaten tanimli; Linux'ta bu satir gerekir.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n        # workflow'lar, credential'lar, calisma kayitlari (SQLite)
      - ./setup:/setup:ro               # import betigi + workflow JSON'lari

  # Faz 10: tarayici otomasyonu (Playwright). n8n onu http://browser-worker:3100 ile cagirir
  # (ayni compose'daki servisler birbirine servis adiyla ulasir).
  # Ilk kez / kod degisince:  docker compose up -d --build browser-worker
  browser-worker:
    build: ../browser-worker
    container_name: jobhunter-browser-worker
    restart: unless-stopped
    init: true
    shm_size: "1gb"              # Chromium Docker'da /dev/shm kucukse cokebilir
    ports:
      - "127.0.0.1:3100:3100"    # sadece bu bilgisayardan (saglik kontrolu icin); disaridan erisilemez
    environment:
      - WORKER_SECRET=${BROWSER_WORKER_SECRET:?.env dosyasinda BROWSER_WORKER_SECRET tanimlanmali}
      - JOBHUNTER_API_KEY=${JOBHUNTER_API_KEY:?.env dosyasinda JOBHUNTER_API_KEY tanimlanmali}
      # GUVENLIK: sadece bu sunuculardaki ilanlar acilir (Faz 12'ye kadar yerel test sitesi).
      - ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
      - TZ=Europe/Istanbul
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../browser-worker/data:/data   # ekran goruntuleri: automation/browser-worker/data/screenshots

volumes:
  n8n_data:
    name: jobhunter_n8n_data
